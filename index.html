  amber: "#B4761F", amberSoft: "#FBF1E1",
  red: "#A6382C", redSoft: "#FBEBE8",

const money = (n) => {
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  return sign + "$" + abs.toLocaleString("en-US", { maximumFractionDigits: 0 });
};
const moneyShort = (n) => {
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return sign + "$" + (abs / 1_000_000).toFixed(2) + "M";
  if (abs >= 1_000) return sign + "$" + (abs / 1_000).toFixed(0) + "K";
  return sign + "$" + abs;
};

    </svg>

/* ---------------------------------------------------------------------
   PRIMITIVES
--------------------------------------------------------------------- */
function StatusDot({ tone }) {
  const color = { high: C.red, medium: C.amber, low: C.slateSoft, good: C.green }[tone] || C.slateSoft;
  return <span style={{ width: 7, height: 7, borderRadius: "50%", background: color, display: "inline-block", flexShrink: 0 }} />;
}

function Delta({ value }) {
  const positive = value > 0;
  const Ic = value === 0 ? null : positive ? ArrowUpRightIcon : ArrowDownRightIcon;
  const color = value === 0 ? C.slateSoft : positive ? C.green : C.red;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 2, color, fontSize: 12.5, fontWeight: 500 }}>
      {Ic && <Ic size={13} strokeWidth={2.4} />}
      {moneyShort(Math.abs(value))}
    </span>
  );
}

function Panel({ title, eyebrow, right, children, style }) {
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, ...style }}>
      {(title || right) && (
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", padding: "14px 18px", borderBottom: `1px solid ${C.lineSoft}` }}>
          <div>
            {eyebrow && <div style={{ fontSize: 11, color: C.slateSoft, marginBottom: 2, fontWeight: 500 }}>{eyebrow}</div>}
            {title && <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15.5, fontWeight: 600, margin: 0, color: C.text }}>{title}</h3>}
          </div>
          {right}
        </div>
      )}
      <div>{children}</div>
    </div>
  );
}

function Pill({ children, tone = "slate" }) {
  const map = {
    slate: { bg: C.lineSoft, fg: C.slate }, blue: { bg: C.blueSoft, fg: C.blue },
    green: { bg: C.greenSoft, fg: C.green }, amber: { bg: C.amberSoft, fg: C.amber }, red: { bg: C.redSoft, fg: C.red },
  }[tone];
  return (
    <span style={{ display: "inline-flex", alignItems: "center", padding: "3px 8px", borderRadius: 3, background: map.bg, color: map.fg, fontSize: 12, fontWeight: 600, whiteSpace: "nowrap" }}>
      {children}
    </span>
  );
}

function btnStyle(tone) {
  const base = { border: "none", padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", borderRadius: 3, fontFamily: "'IBM Plex Sans', sans-serif" };
  if (tone === "blue") return { ...base, background: C.blue, color: "#fff" };
  if (tone === "outline") return { ...base, background: "transparent", color: C.text, border: `1px solid ${C.line}` };
  if (tone === "green") return { ...base, background: C.green, color: "#fff" };
  if (tone === "text") return { background: "transparent", color: C.blue, border: "none", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "'IBM Plex Sans', sans-serif", display: "inline-flex", alignItems: "center", gap: 2 };
  return {};
}

const thStyle = { padding: "10px 18px", borderBottom: `1px solid ${C.lineSoft}` };

/* ---------------------------------------------------------------------
   REVENUE BRIDGE (custom SVG waterfall — no chart library)
--------------------------------------------------------------------- */
function colorForBridge(type) {
  if (type === "total") return C.ink;
  if (type === "increase") return C.green;
  return C.red;
}

function WaterfallChart() {
  const width = 800, height = 320;
  const padLeft = 64, padRight = 16, padTop = 34, padBottom = 34;
  const chartW = width - padLeft - padRight, chartH = height - padTop - padBottom;
  const yMin = 4_400_000, yMax = 5_000_000;
  const scaleY = (v) => padTop + ((yMax - v) / (yMax - yMin)) * chartH;
  const n = bridgeData.length;
  const barGap = 0.32;
  const barSlot = chartW / n;
  const barW = barSlot * (1 - barGap);

  const ticks = [4_400_000, 4_600_000, 4_800_000, 5_000_000];

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} role="img" aria-label="Revenue bridge waterfall chart">
      {ticks.map((t) => (
        <g key={t}>
          <line x1={padLeft} x2={width - padRight} y1={scaleY(t)} y2={scaleY(t)} stroke={C.lineSoft} strokeWidth="1" />
          <text x={padLeft - 10} y={scaleY(t) + 4} textAnchor="end" fontSize="11.5" fontFamily="IBM Plex Mono" fill={C.slateSoft}>
            {moneyShort(t)}
          </text>
        </g>
      ))}
      <line x1={padLeft} x2={width - padRight} y1={padTop + chartH} y2={padTop + chartH} stroke={C.line} strokeWidth="1" />

      {bridgeData.map((row, i) => {
        const slotX = padLeft + i * barSlot + (barSlot - barW) / 2;
        let topY, bottomY;
        if (row.type === "total") {
          topY = scaleY(row.value);
          bottomY = padTop + chartH;
        } else {
          topY = scaleY(row.base + row.display);
          bottomY = scaleY(row.base);
        }
        const barH = Math.max(bottomY - topY, 1);
        const label = row.type === "total" ? money(row.value) : (row.signedValue > 0 ? "+" : "") + moneyShort(row.signedValue);
        return (
          <g key={row.name}>
            <rect x={slotX} y={topY} width={barW} height={barH} fill={colorForBridge(row.type)} rx="1" />
            <text x={slotX + barW / 2} y={topY - 9} textAnchor="middle" fontSize="12" fontFamily="IBM Plex Mono" fontWeight="500" fill={C.text}>
              {label}
            </text>
            <text x={slotX + barW / 2} y={padTop + chartH + 20} textAnchor="middle" fontSize="12" fontFamily="IBM Plex Sans" fill={C.slate}>
              {row.name}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

/* ---------------------------------------------------------------------
   ADJUSTMENT WORKFLOW
--------------------------------------------------------------------- */
function AdjustmentWorkflow({ adjustments, setAdjustments, focusId, setFocusId }) {
  const active = adjustments.find((a) => a.id === focusId) || adjustments[0];
  const act = (action) => {
    setAdjustments((prev) => prev.map((a) => {
      if (a.id !== active.id) return a;
      const now = "2026-08-21 " + new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
      if (action === "approve") return { ...a, status: "Approved", audit: [...a.audit, { ts: now, actor: a.approver, action: "Approved — adjustment posted to revenue ledger" }] };
      return { ...a, status: "Rejected", audit: [...a.audit, { ts: now, actor: a.approver, action: "Rejected — returned to submitter for revision" }] };
    }));
  };
  return (
    <div style={{ display: "grid", gridTemplateColumns: "300px 1fr", gap: 16 }}>
      <Panel title="Queue" eyebrow={`${adjustments.length} adjustments`}>
        <div>
          {adjustments.map((a) => (
            <button key={a.id} onClick={() => setFocusId(a.id)} style={{
              display: "block", width: "100%", textAlign: "left", padding: "12px 18px", cursor: "pointer",
              border: "none", borderBottom: `1px solid ${C.lineSoft}`, background: a.id === active.id ? C.blueSoft : "transparent",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.slateSoft }}>{a.id}</span>
                <Pill tone={a.status === "Approved" ? "green" : a.status === "Rejected" ? "red" : "amber"}>{a.status}</Pill>
              </div>
              <div style={{ fontSize: 12.5, fontWeight: 500, color: C.text, lineHeight: 1.4 }}>{a.proposedChange}</div>
              <div style={{ fontSize: 11.5, color: C.slateSoft, marginTop: 4, fontFamily: "'IBM Plex Mono', monospace" }}>{a.txn}</div>
            </button>
          ))}
        </div>
      </Panel>
      <div>
        <Panel eyebrow={active.id} title="Proposed change" right={<Pill tone={active.status === "Approved" ? "green" : active.status === "Rejected" ? "red" : "amber"}>{active.status}</Pill>}>
          <div style={{ padding: "18px 22px" }}>
            <p style={{ margin: 0, fontSize: 14.5, lineHeight: 1.5, color: C.text }}>{active.proposedChange}</p>
            <div style={{ display: "flex", gap: 28, marginTop: 16, flexWrap: "wrap" }}>
              <div><div style={{ fontSize: 12, color: C.slate }}>Financial impact</div><div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 20, fontWeight: 500, marginTop: 2, color: active.financialImpact < 0 ? C.red : C.green }}>{active.financialImpact > 0 ? "+" : ""}{money(active.financialImpact)}</div></div>
              <div><div style={{ fontSize: 12, color: C.slate }}>Transaction</div><div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, marginTop: 4 }}>{active.txn}</div></div>
              <div><div style={{ fontSize: 12, color: C.slate }}>Submitted by</div><div style={{ fontSize: 14, marginTop: 4 }}>{active.submittedBy} · {active.submittedOn}</div></div>
            </div>
          </div>
        </Panel>
        <Panel title="Reason" style={{ marginTop: 16 }}>
          <div style={{ padding: "16px 22px" }}><p style={{ margin: 0, fontSize: 13.5, color: C.slate, lineHeight: 1.6 }}>{active.reason}</p></div>
        </Panel>
        <Panel title="Approver" style={{ marginTop: 16 }} right={active.status === "Pending" && (
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => act("reject")} style={btnStyle("outline")}>Reject</button>
            <button onClick={() => act("approve")} style={btnStyle("green")}>Approve</button>
          </div>
        )}>
          <div style={{ padding: "16px 22px", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 32, height: 32, borderRadius: "50%", background: C.ink, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 600, fontFamily: "'Space Grotesk', sans-serif" }}>
              {active.approver.split(" ").map((s) => s[0]).join("")}
            </div>
            <div><div style={{ fontSize: 13.5, fontWeight: 500 }}>{active.approver}</div><div style={{ fontSize: 12, color: C.slateSoft }}>Revenue controller</div></div>
          </div>
        </Panel>
        <Panel title="Audit trail" eyebrow={`${active.audit.length} events`} style={{ marginTop: 16 }}>
          <div style={{ padding: "16px 22px" }}>
            {active.audit.map((entry, i) => (
              <div key={i} style={{ display: "flex", gap: 12, paddingBottom: i < active.audit.length - 1 ? 14 : 0 }}>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", paddingTop: 3 }}>
                  <div style={{ width: 7, height: 7, borderRadius: "50%", background: C.blue, flexShrink: 0 }} />
                  {i < active.audit.length - 1 && <div style={{ width: 1, flex: 1, background: C.line, marginTop: 2 }} />}
                </div>
                <div style={{ paddingBottom: 2 }}>
                  <div style={{ fontSize: 11.5, color: C.slateSoft, fontFamily: "'IBM Plex Mono', monospace" }}>{entry.ts}</div>
                  <div style={{ fontSize: 13, marginTop: 2 }}><strong style={{ fontWeight: 600 }}>{entry.actor}</strong> — {entry.action}</div>
                </div>
              </div>
            ))}
          </div>
        </Panel>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   ROOT APP
--------------------------------------------------------------------- */
function App() {
  const [active, setActive] = useState("overview");
  const [txnId, setTxnId] = useState("TXN-10432");
  const [adjustments, setAdjustments] = useState(initialAdjustments);
  const [focusAdjId, setFocusAdjId] = useState(initialAdjustments[0].id);

  const openExceptionCount = exceptions.length;
  const pendingCount = adjustments.filter((a) => a.status === "Pending").length;

  const goTo = (id) => setActive(id);
  const openTxn = (id) => { setTxnId(id); setActive("detail"); };
  const proposeAdjustment = (txn) => {
    const existing = adjustments.find((a) => a.txn === txn);
    if (existing) { setFocusAdjId(existing.id); setActive("workflow"); return; }
    setActive("workflow");
  };

  const moduleTitle = MODULES.find((m) => m.id === active)?.label;

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", background: C.paper, color: C.text, display: "flex", minHeight: "100vh" }}>
      <Rail active={active} onSelect={setActive} exceptionCount={openExceptionCount} pendingCount={pendingCount} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ padding: "18px 28px", borderBottom: `1px solid ${C.line}`, background: C.panel, display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
          <div>
            <div style={{ fontSize: 12, color: C.slateSoft }}>Revenue Control Tower · {PERIOD}</div>
            <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 21, fontWeight: 600, margin: "2px 0 0" }}>{moduleTitle}</h1>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: C.slate }}>
            <ClockIcon size={13} /> Last synced 6 minutes ago
          </div>
        </div>
        <div style={{ padding: "24px 28px 40px" }}>
          {active === "overview" && <Overview goTo={goTo} />}
          {active === "bridge" && <RevenueBridge goTo={goTo} />}
          {active === "exceptions" && <Exceptions openTxn={openTxn} />}
          {active === "detail" && <TransactionDetail txnId={txnId} setTxnId={setTxnId} proposeAdjustment={proposeAdjustment} />}
          {active === "workflow" && <AdjustmentWorkflow adjustments={adjustments} setAdjustments={setAdjustments} focusId={focusAdjId} setFocusId={setFocusAdjId} />}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
